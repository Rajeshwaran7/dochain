version: '3.9'

services:
  # ── PostgreSQL ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: dochain_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-dochain_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dochain_pass}
      POSTGRES_DB: ${DB_NAME:-dochain_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - dochain_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-dochain_user} -d ${DB_NAME:-dochain_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: dochain_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - dochain_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── NestJS API ──────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: dochain_api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      REDIS_HOST: redis
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dochain_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Patient Web App ─────────────────────────────────────
  web-patient:
    build:
      context: .
      dockerfile: docker/Dockerfile.web-patient
    container_name: dochain_web_patient
    restart: unless-stopped
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: http://api:4000/api/v1
    ports:
      - "3001:3001"
    depends_on:
      - api
    networks:
      - dochain_net

  # ── Doctor Web App ──────────────────────────────────────
  web-doctor:
    build:
      context: .
      dockerfile: docker/Dockerfile.web-doctor
    container_name: dochain_web_doctor
    restart: unless-stopped
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: http://api:4000/api/v1
    ports:
      - "3002:3002"
    depends_on:
      - api
    networks:
      - dochain_net

  # ── Nginx Reverse Proxy ─────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: dochain_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - api
      - web-patient
      - web-doctor
    networks:
      - dochain_net

volumes:
  postgres_data:
  redis_data:
  nginx_logs:

networks:
  dochain_net:
    driver: bridge
