# ── API ─────────────────────────────────────────────────────
upstream dochain_api {
    server api:4000;
    keepalive 32;
}

# ── Patient App ──────────────────────────────────────────────
upstream dochain_patient {
    server web-patient:3001;
    keepalive 16;
}

# ── Doctor App ───────────────────────────────────────────────
upstream dochain_doctor {
    server web-doctor:3002;
    keepalive 16;
}

# ── HTTP → HTTPS redirect ────────────────────────────────────
server {
    listen 80;
    server_name dochain.in www.dochain.in api.dochain.in doctor.dochain.in;
    return 301 https://$host$request_uri;
}

# ── Patient App (dochain.in) ─────────────────────────────────
server {
    listen 443 ssl http2;
    server_name dochain.in www.dochain.in;

    ssl_certificate     /etc/nginx/ssl/dochain.crt;
    ssl_certificate_key /etc/nginx/ssl/dochain.key;

    location / {
        proxy_pass http://dochain_patient;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /_next/static {
        proxy_pass http://dochain_patient;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

# ── Doctor Dashboard (doctor.dochain.in) ─────────────────────
server {
    listen 443 ssl http2;
    server_name doctor.dochain.in;

    ssl_certificate     /etc/nginx/ssl/dochain.crt;
    ssl_certificate_key /etc/nginx/ssl/dochain.key;

    location / {
        proxy_pass http://dochain_doctor;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ── API (api.dochain.in) ─────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name api.dochain.in;

    ssl_certificate     /etc/nginx/ssl/dochain.crt;
    ssl_certificate_key /etc/nginx/ssl/dochain.key;

    location /api/v1/auth {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://dochain_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://dochain_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
